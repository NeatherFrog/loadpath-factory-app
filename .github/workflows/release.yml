name: CI & Release

# Every push to main runs the checks. If package.json has a version that has no
# release yet, a Windows installer is built and published to GitHub Releases —
# installed apps pick it up automatically (electron-updater).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  release:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Is this version already released?
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "v$VERSION already released — bump the version in package.json to ship an update."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.exists == 'false'
        run: npm ci
      - if: steps.version.outputs.exists == 'false'
        name: Build installer
        run: npm run dist
      # One upload step instead of electron-builder's parallel publishers (they race on release creation).
      - if: steps.version.outputs.exists == 'false'
        name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=${{ steps.version.outputs.version }}
          gh release create "v$V" \
            "release/RetroDrop-Setup-$V.exe" \
            "release/RetroDrop-Setup-$V.exe.blockmap" \
            release/latest.yml \
            --title "RetroDrop Dashboard v$V" \
            --notes-file RELEASE_NOTES.md \
            --target "$GITHUB_SHA"
